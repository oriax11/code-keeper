---
# -------------------------------------------------------------------
# Docker & GitLab Runner Package Installation
# -------------------------------------------------------------------
- name: Remove Docker repository using docker.asc
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/docker.list
    line: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: absent

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install runner prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Create Docker keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Convert Docker GPG key to keyring format
  ansible.builtin.command:
    cmd: >
      gpg --dearmor --yes
      --output /etc/apt/keyrings/docker.gpg
      /etc/apt/keyrings/docker.asc
    creates: /etc/apt/keyrings/docker.gpg

- name: Ensure Docker keyring is world-readable
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    mode: "0644"

- name: Configure Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Install Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Enable Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Download GitLab Runner repository script
  ansible.builtin.get_url:
    url: https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.deb.sh
    dest: /tmp/gitlab-runner-repository.sh
    mode: "0755"

- name: Add GitLab Runner repository
  ansible.builtin.command:
    cmd: /tmp/gitlab-runner-repository.sh
    creates: /etc/apt/sources.list.d/runner_gitlab-runner.list
  register: gitlab_runner_repo

- name: Refresh apt cache after adding GitLab Runner repository
  ansible.builtin.apt:
    update_cache: true
  when: gitlab_runner_repo is changed

- name: Install GitLab Runner
  ansible.builtin.apt:
    name: gitlab-runner
    state: present

- name: Add GitLab Runner to Docker group
  ansible.builtin.user:
    name: gitlab-runner
    groups: docker
    append: true
  notify: Restart GitLab Runner

- name: Enable GitLab Runner
  ansible.builtin.systemd:
    name: gitlab-runner
    state: started
    enabled: true

# -------------------------------------------------------------------
# Multi-Repository Runner Registration Loop
# -------------------------------------------------------------------
- name: Check local runner registration list
  ansible.builtin.command:
    cmd: gitlab-runner list
  register: gitlab_runner_list
  changed_when: false
  failed_when: false

- name: Register project runners across all group repositories
  ansible.builtin.include_tasks: register_runner.yml
  loop: "{{ gitlab_repositories }}"
  loop_control:
    loop_var: current_repo